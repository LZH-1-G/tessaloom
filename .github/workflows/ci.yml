name: M0 checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # Schema/migration drift (M1): fails if migrations do not match the Drizzle schema.
      - run: pnpm db:check
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:unit --coverage
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tessaloom
          POSTGRES_PASSWORD: local-development-only
          POSTGRES_DB: tessaloom
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tessaloom -d tessaloom"
          --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      DATABASE_URL: postgresql://tessaloom:local-development-only@127.0.0.1:5432/tessaloom
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The startup regression executes the actual bundled, keyless worker.
      - run: pnpm --filter worker build
      - run: pnpm test:integration
  e2e:
    runs-on: ubuntu-latest
    # Browser journeys run the full stack (web + worker + queue) against a migrated database,
    # with synthetic fixtures and the scripted AI stand-ins (TEST_PLAN §10).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tessaloom
          POSTGRES_PASSWORD: local-development-only
          POSTGRES_DB: tessaloom
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tessaloom -d tessaloom"
          --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      E2E_DATABASE_URL: postgresql://tessaloom:local-development-only@127.0.0.1:5432/tessaloom_e2e
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm build
      - run: pnpm test:runtime
      - run: pnpm test:e2e
      - run: pnpm test:e2e
        env:
          INVITE_E2E: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: test-results/
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=high
      - run: docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.30.0 git /repo --redact --config /repo/.gitleaks.toml
      - run: pnpm --filter web build
        env:
          QLOO_API_KEY: m0-qloo-secret-sentinel
          ANTHROPIC_API_KEY: m0-llm-secret-sentinel
          GEMINI_API_KEY: live-gemini-secret-sentinel
          DEEPSEEK_API_KEY: live-deepseek-secret-sentinel
          DATABASE_URL_MIGRATOR: m0-migrator-secret-sentinel
      - run: pnpm check:bundle
      - run: docker run --rm --cap-drop ALL --security-opt no-new-privileges -v "$PWD/pnpm-lock.yaml:/scan/pnpm-lock.yaml:ro" ghcr.io/google/osv-scanner:v2.3.0 scan source --lockfile /scan/pnpm-lock.yaml
  codeql:
    # Code scanning uploads need GitHub Code Security on private repositories, so CodeQL runs
    # only while the repository is public; it starts automatically once visibility changes.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@v4
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: docker build -t tessaloom:m0 .
      - run: node scripts/container-smoke.mjs
      - run: node deploy/smoke.mjs
        env:
          M10B_IMAGE: tessaloom:m0
      - run: node deploy/northflank-smoke.mjs
        env:
          NF_IMAGE: tessaloom:m0
