name: M0 checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:unit --coverage
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tessaloom
          POSTGRES_PASSWORD: local-development-only
          POSTGRES_DB: tessaloom
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tessaloom -d tessaloom"
          --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      DATABASE_URL: postgresql://tessaloom:local-development-only@127.0.0.1:5432/tessaloom
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # No migration command in M0: schemas and migrations belong to M1.
      - run: pnpm test:integration
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm build
      - run: pnpm test:runtime
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m0-browser-evidence
          path: test-results/
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=high
      - run: docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.30.0 git /repo --redact --config /repo/.gitleaks.toml
      - run: pnpm --filter web build
        env:
          QLOO_API_KEY: m0-qloo-secret-sentinel
          ANTHROPIC_API_KEY: m0-llm-secret-sentinel
          DATABASE_URL_MIGRATOR: m0-migrator-secret-sentinel
      - run: pnpm check:bundle
      - run: docker run --rm --cap-drop ALL --security-opt no-new-privileges -v "$PWD/pnpm-lock.yaml:/scan/pnpm-lock.yaml:ro" ghcr.io/google/osv-scanner:v2.3.0 scan source --lockfile /scan/pnpm-lock.yaml
  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@v4
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: docker build -t tessaloom:m0 .
      - run: node scripts/container-smoke.mjs
